name: Nextjs build with cashing and artifact

on: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout Repo
        uses: actions/checkout@v6.0.0

      - name: setup nodejs
        uses: actions/setup-node@v6.0.0
        with:
           node-version: 22.x
           cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: build next js app
        run: npm run build

      - name: upload build on artifact
        uses: actions/upload-artifact@v5.0.0
        with:
         name: nextjs-build
         path: out/
        
      
      
